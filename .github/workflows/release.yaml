name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)run the release for, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve_tag
        run: |
          echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve_tag.outputs.tag }}
          fetch-depth: 0 # full history required for git-cliff
          fetch-tags: true
          show-progress: true
          submodules: recursive

      - name: Install Go
        id: install_go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install git-cliff
        id: install_git_cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Test
        id: test
        run: |
          go test -race ./...

      # A Go module is fetchable via `go get` the moment its tag exists on the remote —
      # there is no registry push step equivalent to `cargo publish`. This step requests
      # the tagged version from the public module proxy so pkg.go.dev and proxy-backed
      # `go get` consumers see it immediately rather than waiting on an organic first
      # fetch to trigger indexing. Best-effort: a proxy hiccup here must not fail the
      # release, since the module remains fetchable via direct VCS regardless.
      - name: Trigger Go module proxy indexing
        id: proxy_index
        continue-on-error: true
        env:
          GOPROXY: https://proxy.golang.org
          GOFLAGS: -mod=mod
        run: |
          VERSION="${{ steps.resolve_tag.outputs.tag }}"
          go list -m "github.com/pilgrimagesoftware/dtrpg-sdk.go@${VERSION}"

      - name: Generate changelog for this tag
        id: changelog
        run: |
          git-cliff --current --strip header -o RELEASE_NOTES.md

      - name: Create GitHub Release
        id: github_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          body_path: RELEASE_NOTES.md

      - name: Update develop from master
        id: update_develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "ci@pilgrimagesoftware.com"
          git config --global user.name "Pilgrimage Software CI"
          git checkout develop
          git merge origin/master
          git push origin develop
