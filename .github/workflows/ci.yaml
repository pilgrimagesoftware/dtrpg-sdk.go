name: CI

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency: ci

jobs:
  test:
    name: Validate on ${{ matrix.name }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS (Intel)
            os: macos-13
          - name: macOS (Apple Silicon)
            os: macos-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Go
        id: install_go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        id: check_fmt
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        id: vet
        run: |
          go vet ./...

      - name: Lint
        id: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        id: test
        run: |
          go test -race ./...
